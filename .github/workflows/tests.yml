name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Reproduce pinned vendor output
        run: npm run vendor
      - name: Check committed vendor output
        run: git diff --exit-code
      - run: npm test
      - name: Install static plugin validator
        run: npm install --global @anthropic-ai/claude-code@2.1.285 --no-audit --no-fund
      - name: Validate both manifests without model access
        run: npm run validate
